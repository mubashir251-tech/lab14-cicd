
name: Lab 14 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/lab14-app

jobs:
  build:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  integration-test:
    name: Test Flask Redis Nginx
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create test environment
        run: |
          printf 'REDIS_PASSWORD=%s\nAPP_VERSION=%s\nAPP_ENV=test\n' \
            "$(openssl rand -hex 32)" "$(cat VERSION)" > .env
          chmod 600 .env

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker-compose ps
          docker-compose logs
          exit 1

      - name: Test request counter
        run: |
          first=$(curl --fail --silent http://localhost/)
          second=$(curl --fail --silent http://localhost/)
          echo "$first"
          echo "$second"
          echo "$first" | grep -q '"request_count":1'
          echo "$second" | grep -q '"request_count":2'

      - name: Clean up
        if: always()
        run: docker compose down -v

  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build scan image
        run: docker build -t lab14-app:scan .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Generate report
        run: |
          trivy image --format table --output trivy-report.txt lab14-app:scan
          trivy image --format json --output trivy-report.json lab14-app:scan

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: |
            trivy-report.txt
            trivy-report.json

  deploy-approval:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Approval confirmed
        run: echo "Production environment approval granted."
